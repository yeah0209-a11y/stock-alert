# 每天自動執行 fetch_data.py,更新手機 App 的資料並發 LINE 推播
name: 處置股雷達

on:
  schedule:
    # GitHub 用的是 UTC 時間,台灣時間 = UTC + 8
    # 週一到週五 台灣時間 18:40(證交所盤後公告之後)
    - cron: "40 10 * * 1-5"
  workflow_dispatch: # 允許你在 GitHub 網頁上按按鈕手動執行

permissions:
  contents: write # 允許把更新後的資料存回儲存庫

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install requests

      - name: 抓資料、計算、推播
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python fetch_data.py

      - name: 存回最新資料
        run: |
          git config user.name "stock-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json data/history.json
          git diff --cached --quiet || git commit -m "更新資料 $(date -u +%F)"
          git push
