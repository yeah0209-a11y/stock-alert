# 一次性測試推播(用 11/23 收盤資料),用完會刪除
name: 測試推播
on:
  push:
    branches: [main]
    paths: [".github/workflows/test-send.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests pandas numpy yfinance
      - env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          DEMO_TODAY: "2026-11-23"
          LINE_PREFIX: "🧪 測試推播(用 11/23 收盤資料,今晚 18:40 起才是正式提醒)"
        run: python fetch_data.py 2>&1 | tee /tmp/run.log
      - run: |
          git config user.name "stock-alert-bot"; git config user.email "actions@users.noreply.github.com"
          git add docs/data.json data/history.json data/inst_cache.json
          git commit -m "測試推播資料" || true
          git pull --rebase origin main && git push
