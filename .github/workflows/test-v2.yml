# 新版測試:只在 v2 分支執行,不發 LINE
name: 新版測試
on:
  push:
    branches: [v2]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests pandas numpy yfinance
      - run: NO_LINE=1 DEMO_TODAY=2026-11-23 python fetch_data.py 2>&1 | tee test_run.log
      - if: always()
        run: |
          git config user.name "stock-alert-bot"; git config user.email "actions@users.noreply.github.com"
          git add -f docs/data.json data/history.json data/inst_cache.json test_run.log
          git commit -m "v2 測試結果" || true
          git push
